<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B5D2E">
<title>Pase de lista · Fresko Cumbres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0B5D2E; --verde-2:#2E9E4F; --naranja:#F2681F;
  --arena:#FFF6EC; --panel:#fff; --tinta:#14231A; --tinta-2:#5A6B60; --tinta-3:#8A968D;
  --linea:#E7DFD4; --linea-2:#D3C8B8; --error:#C2321B; --ok-bg:#DCEFE2; --radio:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89; --ok-bg:#17331F;
}}
:root[data-theme="dark"]{
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89; --ok-bg:#17331F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--arena);color:var(--tinta);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
button{font:inherit;cursor:pointer}
input,select{width:100%;padding:13px;font:inherit;font-size:16px;color:var(--tinta);background:var(--panel);
  border:1.5px solid var(--linea-2);border-radius:var(--radio)}
input:focus,select:focus{outline:2px solid var(--verde-2);outline-offset:1px}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 6px}

/* ---------- acceso ---------- */
#acceso{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.caja{width:100%;max-width:370px;background:var(--panel);border:1px solid var(--linea);
  border-radius:18px;padding:26px 24px}
.caja h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.caja .sub{margin:0 0 18px;color:var(--tinta-2);font-size:14px}
.principal{width:100%;margin-top:18px;padding:14px;background:var(--verde);color:#fff;border:none;
  border-radius:var(--radio);font-weight:700;font-size:16.5px}
.principal:disabled{opacity:.6}
.msg{margin-top:12px;font-size:14px;font-weight:600;color:var(--error);display:none}
.msg.on{display:block}

/* ---------- encabezado ---------- */
#app{display:none}
header{background:var(--verde);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.head-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.h-tit{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#BFE6CB;font-weight:600}
.marcador{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;line-height:1;
  font-variant-numeric:tabular-nums}
.marcador small{font-size:14px;font-weight:400;color:#BFE6CB}
.h-der{display:flex;gap:8px;align-items:center}
.salir,.enlace{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;
  padding:6px 13px;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}

/* ---------- captura ---------- */
.captura{background:var(--panel);border:1px solid var(--linea);border-radius:18px;
  padding:18px 16px;margin-top:16px}
.folio-fila{display:flex;gap:10px}
#folio{flex:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;
  text-align:center;letter-spacing:.12em;padding:12px 10px;font-variant-numeric:tabular-nums}
#registrar{width:132px;margin:0;flex:none;background:var(--verde);color:#fff;border:none;
  border-radius:var(--radio);font-weight:700;font-size:17px}
#registrar:disabled{opacity:.55}
.pista{margin:10px 2px 0;font-size:13.5px;color:var(--tinta-3)}

.modos{display:flex;gap:8px;margin-top:14px}
.modo{flex:1;padding:9px;border:1.5px solid var(--linea-2);background:var(--panel);color:var(--tinta-2);
  border-radius:99px;font-size:14px;font-weight:600}
.modo[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}

/* ---------- tarjeta de resultado ---------- */
.tarjeta{margin-top:14px;border-radius:16px;padding:16px;display:none;border:1.5px solid transparent}
.tarjeta.on{display:block}
.tarjeta.si{background:var(--ok-bg);border-color:var(--verde-2)}
.tarjeta.rep{background:#FFF1DC;border-color:var(--naranja)}
.tarjeta.no{background:#FAE5E0;border-color:var(--error)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tarjeta.rep{background:#33240F}
  :root:not([data-theme="light"]) .tarjeta.no{background:#3A1712}}
.t-folio{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--tinta-2)}
.t-nombre{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;line-height:1.15;
  margin:2px 0 6px;letter-spacing:-.02em}
.t-datos{font-size:14.5px;color:var(--tinta-2)}
.t-datos b{color:var(--tinta)}
.t-pie{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deshacer{background:transparent;border:1.5px solid var(--linea-2);color:var(--tinta-2);
  border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:600}
.alerta{font-size:13.5px;font-weight:600;color:var(--naranja)}

/* ---------- ayer y pago ---------- */
.t-ayer{margin-top:10px;font-size:14.5px;font-weight:600}
.t-ayer.si{color:var(--verde)}
.t-ayer.no{color:var(--tinta-2)}
.pago{margin-top:12px;padding:14px;border-radius:12px;background:var(--panel);
  border:1.5px solid var(--linea-2)}
.pago.debe{border-color:var(--naranja)}
.pago.saldado{border-color:var(--verde-2)}
.pago-tit{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-3)}
.pago-monto{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:38px;
  line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 2px}
.pago.debe .pago-monto{color:var(--naranja)}
.pago.saldado .pago-monto{color:var(--verde)}
.pago-dias{font-size:13.5px;color:var(--tinta-2)}
.pagar{width:100%;margin-top:12px;padding:15px;background:var(--naranja);color:#fff;border:none;
  border-radius:var(--radio);font-weight:700;font-size:17px;display:flex;
  align-items:center;justify-content:center;gap:10px}
.pagar:disabled{opacity:.6}
.pagar .caja{width:22px;height:22px;border:2.5px solid #fff;border-radius:5px;flex:none}
.pago-hecho{display:flex;align-items:center;gap:9px;margin-top:12px;
  font-size:15.5px;font-weight:700;color:var(--verde)}
.pago-hecho .caja{width:22px;height:22px;border:2.5px solid var(--verde);border-radius:5px;
  flex:none;display:flex;align-items:center;justify-content:center;color:var(--verde);
  font-size:15px;line-height:1}
.pago-resta{display:flex;justify-content:space-between;align-items:baseline;
  font-size:14px;color:var(--tinta-2);margin-top:2px}
.pago-resta b{font-variant-numeric:tabular-nums;color:var(--tinta)}
.pago-resta.menos{padding-bottom:6px;border-bottom:1.5px solid var(--linea-2);margin-bottom:4px}
.pago-resta.menos b{color:var(--naranja)}
.ade-lista{margin-top:10px;display:grid;gap:6px}
.ade{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tinta-2);
  background:var(--arena);border-radius:9px;padding:7px 10px}
.ade > span:first-child{flex:1;min-width:0}
.ade .cuando{color:var(--tinta-3);font-size:12.5px;white-space:nowrap}
.ade .quitarAde{background:transparent;border:none;color:var(--tinta-3);font-size:18px;
  line-height:1;padding:0 2px}
.adelantar{width:100%;margin-top:10px;padding:13px;background:transparent;color:var(--verde);
  border:1.5px solid var(--verde);border-radius:var(--radio);font-weight:700;font-size:15.5px}

.verFicha{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;
  color:var(--verde);text-decoration:underline}
.fila .debe{font-size:12.5px;font-weight:700;color:var(--naranja);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .ayer-no{font-size:12px;color:var(--tinta-3);white-space:nowrap}
.fila .ade-marca{font-size:12.5px;font-weight:700;color:var(--verde);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- pestañas y listas ---------- */
.tabs{display:flex;gap:8px;margin:22px 0 12px}
.tab{flex:1;padding:10px;border:1.5px solid var(--linea-2);background:var(--panel);color:var(--tinta-2);
  border-radius:99px;font-size:14px;font-weight:600}
.tab[aria-selected="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--arena)}
.tab .n{font-variant-numeric:tabular-nums}

.fila{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px}
.fila .f{font-weight:700;font-size:14px;color:var(--tinta-2);font-variant-numeric:tabular-nums;min-width:34px}
.fila .n{flex:1;font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.fila .h{font-size:13.5px;color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .eq{display:block;font-size:12.5px;color:var(--tinta-3);font-weight:500}
.fila .quitar{background:transparent;border:none;color:var(--tinta-3);font-size:20px;line-height:1;
  padding:2px 4px}
.fila.falta .f,.fila.falta .n{color:var(--tinta-3)}
.tel{color:var(--verde);text-decoration:none;font-size:13.5px;font-weight:600;white-space:nowrap}
.vacio{background:var(--panel);border:1px dashed var(--linea-2);border-radius:12px;
  padding:22px 16px;text-align:center;color:var(--tinta-3);font-size:14.5px}
.oculto{display:none}

.fecha{display:flex;gap:10px;align-items:center;margin-top:18px}
.fecha label{margin:0;font-size:13.5px;color:var(--tinta-2);white-space:nowrap}
.fecha input{padding:9px 11px;font-size:14.5px}

.aviso{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;
  background:var(--tinta);color:var(--arena);padding:13px 16px;border-radius:12px;
  font-size:14.5px;font-weight:600;opacity:0;transform:translateY(12px);
  transition:opacity .18s,transform .18s;pointer-events:none;z-index:20}
.aviso.on{opacity:1;transform:none}
.aviso.mal{background:var(--error);color:#fff}
</style>
</head>
<body>

<div id="acceso">
  <form class="caja" id="fLogin">
    <h1>Pase de lista</h1>
    <p class="sub">Entra con tu correo y contraseña del equipo.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="principal" id="btnLogin" type="submit">Entrar</button>
    <p class="msg" id="msgLogin"></p>
  </form>
</div>

<div id="app">
  <header>
    <div class="head-in">
      <div>
        <div class="h-tit">Presentes hoy</div>
        <div class="marcador"><span id="nPres">0</span><small> de <span id="nPlant">0</span></small></div>
      </div>
      <div class="h-der">
        <a class="enlace" href="/puestos">Puestos</a>
        <button class="salir" id="btnSalir" type="button">Salir</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="captura">
      <form class="folio-fila" id="fPase">
        <input id="folio" inputmode="numeric" autocomplete="off" enterkeyhint="done"
               placeholder="000" maxlength="6" aria-label="Folio">
        <button class="principal" id="registrar" type="submit">Registrar</button>
      </form>
      <p class="pista">Pregúntale su folio y tecléalo. También puedes escribir su nombre.</p>

      <div class="modos">
        <button class="modo" id="mEntrada" type="button" aria-pressed="true">Entrada</button>
        <button class="modo" id="mSalida" type="button" aria-pressed="false">Salida</button>
      </div>

      <div class="tarjeta" id="tarjeta"></div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" id="tabPres" role="tab" aria-selected="true">
        Ya llegaron <span class="n" id="cPres">0</span></button>
      <button class="tab" id="tabFalta" role="tab" aria-selected="false">
        Faltan <span class="n" id="cFalta">0</span></button>
    </div>

    <div id="listaPres"></div>
    <div id="listaFalta" class="oculto"></div>

    <div class="fecha">
      <label for="dia">Día</label>
      <input id="dia" type="date">
    </div>
  </div>
</div>

<div class="aviso" id="aviso"></div>

<script>
const SUPABASE_URL = "https://eykfdnoczpwjccunzfgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q_fNBD3xtsMtsNtpp3h0wg_j3dkROng";
const CLAVE = "fresko_sesion";

const $  = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));

let SESION = null;
let TIPO   = "entrada";
let DATOS  = { presentes: [], faltantes: [] };
let ULTIMO = null;

/* ---------------- sesión ---------------- */
const guardar = (s) => { try { sessionStorage.setItem(CLAVE, JSON.stringify(s)); } catch(e){} };
const leerSes = () => { try { const s = JSON.parse(sessionStorage.getItem(CLAVE)||"null");
  return (s && s.access_token && s.expira > Date.now()+30000) ? s : null; } catch(e){ return null; } };
const borrar  = () => { try { sessionStorage.removeItem(CLAVE); } catch(e){} };

async function entrar(email, password) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:"POST", headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "No se pudo iniciar sesión");
  return { access_token:d.access_token, expira: Date.now() + (d.expires_in||3600)*1000 };
}

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SESION.access_token}`, "Content-Type":"application/json" },
    body: JSON.stringify(body || {})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || d.msg || `error ${r.status}`);
  return d;
}

const pesos = (n) => "$" + Number(n || 0).toLocaleString("es-MX");
const diaCorto = (s) => s
  ? new Date(s + "T12:00:00").toLocaleDateString("es-MX", { weekday:"short", day:"numeric" })
  : "";

function avisar(txt, mal) {
  const a = $("#aviso");
  a.textContent = txt;
  a.className = "aviso on" + (mal ? " mal" : "");
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => a.classList.remove("on"), 3800);
}

/* ---------------- pintar ---------------- */
function filaPresente(p) {
  const eq = p.equipo ? `<span class="eq">${esc(p.equipo)}</span>` : "";
  const sal = p.salida ? ` · salió ${esc(p.salida)}` : "";
  return `<div class="fila">
      <span class="f">${esc(p.folio)}</span>
      <span class="n">${esc(p.nombre)}${eq}</span>
      ${Number(p.por_pagar) > 0 ? `<span class="debe">debe ${pesos(p.por_pagar)}</span>`
        : Number(p.adelantado) > 0 ? `<span class="ade-marca">adelanto ${pesos(p.adelantado)}</span>` : ""}
      <span class="h">${esc(p.hora)}${sal}</span>
      <button class="quitar" type="button" data-quitar="${esc(p.folio)}"
              title="Quitar el registro de ${esc(p.nombre)}" aria-label="Quitar a ${esc(p.nombre)}">×</button>
    </div>`;
}

function filaFalta(p) {
  const eq  = p.equipo ? `<span class="eq">${esc(p.equipo)}</span>` : "";
  const tel = p.telefono
    ? `<a class="tel" href="https://wa.me/52${esc(String(p.telefono).replace(/\D/g,"").slice(-10))}">WhatsApp</a>` : "";
  const ayer = p.vino_ayer === false ? `<span class="ayer-no">tampoco ayer</span>` : "";
  return `<div class="fila falta">
      <span class="f">${esc(p.folio)}</span>
      <span class="n">${esc(p.nombre)}${eq}</span>
      ${Number(p.por_pagar) > 0 ? `<span class="debe">debe ${pesos(p.por_pagar)}</span>` : ayer}${tel}
    </div>`;
}

function pintar(d) {
  DATOS = d;
  const pres = d.presentes || [], falta = d.faltantes || [];
  $("#cPres").textContent  = pres.length;
  $("#cFalta").textContent = falta.length;
  $("#nPres").textContent  = pres.length;
  $("#nPlant").textContent = pres.length + falta.length;

  $("#listaPres").innerHTML = pres.length
    ? pres.map(filaPresente).join("")
    : `<div class="vacio">Todavía no pasas lista a nadie hoy. Teclea el primer folio arriba.</div>`;

  $("#listaFalta").innerHTML = falta.length
    ? falta.map(filaFalta).join("")
    : `<div class="vacio">No falta nadie. Están todos.</div>`;
}

function tarjeta(r) {
  const t = $("#tarjeta");
  if (!r) { t.className = "tarjeta"; t.innerHTML = ""; return; }

  if (!r.ok) {
    const textos = {
      NO_EXISTE:      `No existe el folio <b>${esc(r.folio||"")}</b>. Revísalo o dalo de alta en <a href="/lista">pasar lista</a>.`,
      FOLIO_INVALIDO: "Escribe un folio con números, por ejemplo 046.",
      DADO_DE_BAJA:   `<b>${esc(r.nombre||"")}</b> está dado de baja. No cuenta para hoy.`,
      TIPO_INVALIDO:  "Elige entrada o salida."
    };
    t.className = "tarjeta on no";
    t.innerHTML = `<div class="t-nombre">No se registró</div>
      <div class="t-datos">${textos[r.motivo] || esc(r.motivo || "No se pudo registrar.")}</div>`;
    return;
  }

  const datos = [
    r.equipo ? `Equipo <b>${esc(r.equipo)}</b>` : null,
    r.talla  ? `Talla <b>${esc(r.talla)}</b>`   : null
  ].filter(Boolean).join(" · ");

  const aviso = !r.fue_capacitacion
    ? `<span class="alerta">No fue a la capacitación</span>` : "";

  // ¿Vino ayer? Es lo primero que Alberto pregunta al pagar.
  const ay = r.ayer || {};
  const ayer = ay.dia
    ? (ay.vino
        ? `<div class="t-ayer si">✓ Sí vino ayer (${esc(diaCorto(ay.dia))})</div>`
        : `<div class="t-ayer no">✗ No vino ayer (${esc(diaCorto(ay.dia))})</div>`)
    : "";

  // Lo que se le debe: jornadas anteriores sin pagar, menos lo que ya se
  // le adelantó. Lo que de verdad se le entrega es el neto.
  const bruto = Number(r.total_por_pagar || 0);
  const adel  = Number(r.adelantado || 0);
  const neto  = Number(r.neto || 0);
  const dias  = r.por_pagar || [];
  const ades  = r.adelantos || [];

  const lineaAdelanto = adel > 0
    ? `<div class="pago-resta">
         <span>Jornadas</span><b>${pesos(bruto)}</b></div>
       <div class="pago-resta menos">
         <span>Adelantos que le diste</span><b>− ${pesos(adel)}</b></div>`
    : "";

  const detalleAde = ades.length
    ? `<div class="ade-lista">${ades.map((a) => `<div class="ade">
         <span>${pesos(a.monto)}${a.motivo ? " · " + esc(a.motivo) : ""}</span>
         <span class="cuando">${esc(a.cuando || "")}</span>
         <button class="quitarAde" type="button" data-ade="${esc(a.id)}"
                 aria-label="Quitar este adelanto">×</button></div>`).join("")}</div>`
    : "";

  const pago = neto > 0
    ? `<div class="pago debe">
         <div class="pago-tit">${adel > 0 ? "Entrégale" : "Le debes"}</div>
         ${lineaAdelanto}
         <div class="pago-monto">${pesos(neto)}</div>
         <div class="pago-dias">${dias.length} ${dias.length === 1 ? "jornada" : "jornadas"}:
           ${dias.map((d) => esc(diaCorto(d.dia))).join(", ")}</div>
         ${detalleAde}
         <button class="pagar" type="button" id="btnPagar">
           <span class="caja"></span> Marcar pagado ${pesos(neto)}</button>
       </div>`
    : `<div class="pago ${adel > 0 ? "debe" : "saldado"}">
         <div class="pago-tit">${adel > 0 ? "Ya cobró por adelantado" : "Le debes"}</div>
         <div class="pago-monto">${pesos(adel > 0 ? adel : 0)}</div>
         <div class="pago-dias">${
           adel > 0 ? "Le debe a la caja. Se le descuenta de sus próximas jornadas." :
           r.tipo === "salida" ? "Nada pendiente." :
           ay.vino ? "El día de ayer ya está pagado. Lo de hoy se le paga mañana."
                   : "No tiene jornadas anteriores sin pagar."}</div>
         ${detalleAde}
         ${adel > 0 ? "" : `<button class="deshacer" type="button" id="btnDespagar"
                 style="margin-top:10px">Quitar un pago</button>`}
       </div>`;

  const botonAdelanto = `<button class="adelantar" type="button" id="btnAdelanto">
      💵 Adelantar dinero</button>`;

  t.className = "tarjeta on " + (r.repetido ? "rep" : "si");
  t.innerHTML = `
    <div class="t-folio">FOLIO ${esc(r.folio)}</div>
    <div class="t-nombre">${esc(r.nombre)}</div>
    <div class="t-datos">
      ${r.repetido ? `Ya tenía ${esc(r.tipo)} desde las <b>${esc(r.hora)}</b>`
                   : `${r.tipo === "salida" ? "Salida" : "Entrada"} registrada a las <b>${esc(r.hora)}</b>`}
      ${datos ? " · " + datos : ""}
    </div>
    ${ayer}
    ${pago}
    ${botonAdelanto}
    <div class="t-pie">
      <button class="deshacer" type="button" id="btnDeshacer">Deshacer pase</button>
      ${aviso}
    </div>
    <a class="verFicha" href="/dash?f=${esc(r.folio)}" target="_blank" rel="noopener">Ver su expediente completo</a>`;

  $("#btnDeshacer").addEventListener("click", deshacer);
  const bp = $("#btnPagar");
  if (bp) bp.addEventListener("click", () => pagar(r.folio, neto));
  const bd = $("#btnDespagar");
  if (bd) bd.addEventListener("click", () => despagar(r.folio));
  $("#btnAdelanto").addEventListener("click", () => adelantar(r.folio, r.nombre));
  t.querySelectorAll("[data-ade]").forEach((b) =>
    b.addEventListener("click", () => quitarAdelanto(r.folio, b.dataset.ade)));
}

/* ---------------- acciones ---------------- */
async function cargar() {
  const d = await rpc("pase_lista_dia", { p_dia: $("#dia").value || null });
  pintar(d);
}

async function registrar(folio) {
  const r = await rpc("pase_lista", { p: { folio, tipo: TIPO, dia: $("#dia").value || null } });
  ULTIMO = r.ok ? { folio: r.folio, tipo: r.tipo, nombre: r.nombre } : null;
  tarjeta(r);
  if (r.ok) {
    avisar(r.repetido ? `${r.nombre} ya estaba registrado` : `✓ ${r.nombre}`);
    await cargar();
  } else {
    avisar("No se registró", true);
  }
}

// Registra el pago de todo lo pendiente y vuelve a pintar la tarjeta
// con el saldo ya en cero, para que se vea que quedó hecho.
async function pagar(folio, monto) {
  const b = $("#btnPagar");
  if (b) { b.disabled = true; b.textContent = "Registrando…"; }
  try {
    const r = await rpc("marcar_pagado", { p: { folio, hoy: $("#dia").value || null } });
    if (!r.ok) { avisar(r.motivo === "NADA_QUE_PAGAR" ? "No tenía nada pendiente" : "No se pudo registrar", true); }
    else avisar(`✓ Pagado ${pesos(r.total)} a ${r.nombre}`);
    tarjeta(await rpc("pase_lista", { p: { folio, tipo: TIPO, dia: $("#dia").value || null } }));
    await cargar();
  } catch (e) {
    avisar(e.message, true);
    if (b) { b.disabled = false; b.textContent = `Marcar pagado ${pesos(monto)}`; }
  }
}

// Entrega dinero por adelantado. Se le descuenta solo cuando se le
// pague la jornada, así que aquí basta con dejarlo anotado.
async function adelantar(folio, nombre) {
  const txt = prompt(`¿Cuánto le vas a adelantar a ${nombre}?\n\nSolo el número, por ejemplo 200`);
  if (txt === null) return;
  const monto = Number(String(txt).replace(/[^\d.]/g, ""));
  if (!monto || monto <= 0) { avisar("Escribe una cantidad, por ejemplo 200", true); return; }
  const motivo = prompt("¿Para qué? (opcional — pasaje, comida, etc.)") || "";
  try {
    const r = await rpc("dar_adelanto", { p: { folio, monto, motivo } });
    if (!r.ok) { avisar("No se pudo registrar el adelanto", true); return; }
    avisar(`✓ Le adelantaste ${pesos(r.monto)} a ${r.nombre}`);
    tarjeta(await rpc("pase_lista", { p: { folio, tipo: TIPO, dia: $("#dia").value || null } }));
    await cargar();
  } catch (e) { avisar(e.message, true); }
}

async function quitarAdelanto(folio, id) {
  try {
    const r = await rpc("deshacer_adelanto", { p: { folio, id } });
    avisar(r.ok ? "Adelanto quitado" : "Ese adelanto ya se había descontado", !r.ok);
    tarjeta(await rpc("pase_lista", { p: { folio, tipo: TIPO, dia: $("#dia").value || null } }));
    await cargar();
  } catch (e) { avisar(e.message, true); }
}

async function despagar(folio) {
  try {
    const r = await rpc("deshacer_pago", { p: { folio } });
    avisar(r.ok ? `Se quitó el pago de ${r.nombre}` : "No había pago reciente que quitar", !r.ok);
    tarjeta(await rpc("pase_lista", { p: { folio, tipo: TIPO, dia: $("#dia").value || null } }));
    await cargar();
  } catch (e) { avisar(e.message, true); }
}

async function deshacer() {
  if (!ULTIMO) return;
  const r = await rpc("deshacer_pase", { p: { folio: ULTIMO.folio, tipo: ULTIMO.tipo, dia: $("#dia").value || null } });
  tarjeta(null);
  avisar(r.ok ? `Se quitó a ${r.nombre}` : "Ya no estaba registrado", !r.ok);
  ULTIMO = null;
  await cargar();
}

async function porNombre(texto) {
  const lista = await rpc("buscar_candidato", { p_texto: texto });
  const arr = Array.isArray(lista) ? lista : (lista && lista.resultados) || [];
  if (!arr.length) { avisar(`Nadie se llama así: "${texto}"`, true); return; }
  if (arr.length > 1) {
    const t = $("#tarjeta");
    t.className = "tarjeta on rep";
    t.innerHTML = `<div class="t-nombre">¿Cuál de ellos?</div>` +
      arr.slice(0, 6).map((p) => `<div class="fila">
          <span class="f">${esc(p.folio)}</span>
          <span class="n">${esc(p.nombre)}</span>
          <button class="deshacer" type="button" data-elige="${esc(p.folio)}">Es este</button>
        </div>`).join("");
    return;
  }
  await registrar(arr[0].folio);
}

/* ---------------- eventos ---------------- */
$("#fPase").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const txt = $("#folio").value.trim();
  if (!txt) return;
  const b = $("#registrar");
  b.disabled = true;
  try {
    if (/\d/.test(txt)) await registrar(txt);
    else await porNombre(txt);
    $("#folio").value = "";
  } catch (e) { avisar(e.message, true); }
  b.disabled = false;
  $("#folio").focus();
});

$("#tarjeta").addEventListener("click", async (ev) => {
  const f = ev.target.getAttribute && ev.target.getAttribute("data-elige");
  if (!f) return;
  try { await registrar(f); $("#folio").value = ""; $("#folio").focus(); }
  catch (e) { avisar(e.message, true); }
});

$("#listaPres").addEventListener("click", async (ev) => {
  const f = ev.target.getAttribute && ev.target.getAttribute("data-quitar");
  if (!f) return;
  ULTIMO = { folio: f, tipo: "entrada" };
  try { await deshacer(); } catch (e) { avisar(e.message, true); }
});

function modo(t) {
  TIPO = t;
  $("#mEntrada").setAttribute("aria-pressed", String(t === "entrada"));
  $("#mSalida").setAttribute("aria-pressed",  String(t === "salida"));
  $("#registrar").textContent = t === "salida" ? "Salida" : "Registrar";
  $("#folio").focus();
}
$("#mEntrada").addEventListener("click", () => modo("entrada"));
$("#mSalida").addEventListener("click",  () => modo("salida"));

function pestana(cual) {
  const p = cual === "pres";
  $("#tabPres").setAttribute("aria-selected", String(p));
  $("#tabFalta").setAttribute("aria-selected", String(!p));
  $("#listaPres").classList.toggle("oculto", !p);
  $("#listaFalta").classList.toggle("oculto", p);
}
$("#tabPres").addEventListener("click",  () => pestana("pres"));
$("#tabFalta").addEventListener("click", () => pestana("falta"));

$("#dia").addEventListener("change", async () => {
  tarjeta(null);
  try { await cargar(); } catch (e) { avisar(e.message, true); }
});

$("#btnSalir").addEventListener("click", () => { borrar(); location.reload(); });

$("#fLogin").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = $("#btnLogin"), m = $("#msgLogin");
  m.className = "msg"; b.disabled = true; b.textContent = "Entrando…";
  try {
    SESION = await entrar($("#email").value.trim(), $("#pass").value);
    guardar(SESION);
    await arrancar();
  } catch (e) {
    m.className = "msg on"; m.textContent = e.message;
    b.disabled = false; b.textContent = "Entrar";
  }
});

async function arrancar() {
  $("#acceso").style.display = "none";
  $("#app").style.display = "block";
  try { await cargar(); }
  catch (e) {
    if (/SIN_PERMISO/.test(e.message)) {
      $("#app").style.display = "none";
      $("#acceso").style.display = "flex";
      $("#fLogin").innerHTML = `<h1>Sin permiso</h1>
        <p class="sub">Tu cuenta no tiene acceso a pasar lista. Pídele a Alberto que te dé de alta.</p>`;
      return;
    }
    avisar(e.message, true);
  }
  $("#folio").focus();
}

(async () => {
  const hoy = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("#dia").value = hoy;
  SESION = leerSes();
  if (SESION) await arrancar();
})();
</script>
