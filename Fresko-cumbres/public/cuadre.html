.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);font-weight:600}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1.12;margin:4px 0 6px;text-wrap:balance}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin:0 0 8px;font-weight:700}
p{margin:0}

.aviso{font-size:14px;border-left:3px solid var(--debe);padding:6px 0 6px 12px;color:var(--tinta)}
.info{font-size:14px;border-left:3px solid var(--verde);padding:6px 0 6px 12px}
.foto{margin:0;display:grid;gap:6px}
.foto button{all:unset;cursor:zoom-in;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--linea);background:var(--suave);max-width:440px}
.foto img{display:block;width:100%;height:auto}
.foto figcaption{font-size:13px;color:var(--tinta-2)}
.nav2{display:flex;justify-content:space-between;gap:12px}
.nav2 a{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;padding:10px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--panel);color:var(--tinta);max-width:48%}
.nav2 a small{color:var(--tinta-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-block;font:600 15px "Archivo",sans-serif;background:var(--verde);color:var(--verde-fg);text-decoration:none;border-radius:10px;padding:11px 18px}
.file{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.file div{min-width:0;flex:1 1 240px}

.file small{color:var(--tinta-2)}
.pie{font-size:12px;color:var(--tinta-2)}
.visor{position:fixed;inset:0;background:#000;display:none;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch}

const $=s=>document.querySelector(s);
const fm=new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const m=x=>'$'+fm.format(x);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT=Object.fromEntries(D.cats.map(c=>[c.id,c]));
const pct=x=>Math.round(x/D.gas*1000)/10+'%';
function migas(arr){return '<nav class="migas" aria-label="Ruta">'+arr.map((x,i)=>i<arr.length-1?`<a href="${x[1]}">${e(x[0])}</a><span class="sep">›</span>`:`<span>${e(x[0])}</span>`).join('')+'</nav>'}
function fila(href,t,sub,monto,extra){extra=extra||{};
  const tag=href?'a':'div';
  return `<${tag} class="fila${extra.off?' off':''}"${href?` href="${href}"`:''}><div class="tx"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div><div class="m">${monto}</div>${href?'<span class="ch" aria-hidden="true">›</span>':''}</${tag}>`}
function chipFoto(t){return t.foto?'<span class="chip f">foto</span>':''}
function ticketTitulo(t){return t.lote?`${e(t.tienda)}`:'Cargo de tarjeta con ticket'}
function ticketSub(t){return [t.fecha_txt,t.hora,t.pago].filter(Boolean).map(e).join(' · ')}
function montoTicket(t){return m(t.cobra)+(t.alcohol?`<small class="alc">de ${m(t.total)}, sin alcohol</small>`:'')}

function hijosGasto(g){
  const n=(g.tickets||[]).length;
  if(n){const f=g.tickets.filter(id=>D.tickets[id].foto).length;return f===n?`<span class="chip f">${n} tickets con foto</span>`:`<span class="chip f">${n} tickets, ${f} con foto</span>`}
  if(g.cargos)return `<span class="chip f">54 cargos revisados</span>`;
  return '';
}
V.cat=id=>{
  const c=CAT[id]; if(!c)return V.inicio();
  let h=migas([['Inicio','#/'],[c.nombre]])+`<header><h1>${e(c.nombre)}</h1><div class="monto-grande">${m(c.total)}<small>${pct(c.total)} del gasto total</small></div></header><p class="lede">${e(c.intro)}</p>`;
  if(c.tipo==='nomina'){
    h+=`<nav class="tabs"><a class="on" href="#/c/nomina-diaria">Por día</a><a href="#/personas">Por persona (${D.personas.length})</a></nav><div class="lista">`;
    for(const d of D.dias_n){const s=d.personas?`${d.personas} promotores × $400`+(d.extras?` + extras ${m(d.extras)}`:''):(d.total?'Capacitación':'Descanso');
      h+=fila(d.total?`#/n/${d.fecha}`:null,e(d.fecha_txt),e(s),m(d.total),{off:!d.total})}
    return h+`</div>`}
  if(c.tipo==='viaticos'){
    h+=`<div class="lista">`+D.dias_v.map(d=>fila(`#/v/${d.fecha}`,e(d.fecha_txt),d.partes.map(p=>e(p.c.replace(' (cargo de tarjeta)',''))).filter((v,i,a)=>a.indexOf(v)===i).join(' · '),m(d.total))).join('')+`</div>`;return h}
  h+=`<div class="lista">`;
  for(const gid of c.gastos){const g=D.gastos[gid];
    h+=fila(`#/g/${g.id}`,e(g.titulo),[e(g.fecha),hijosGasto(g),g.estado?`<span class="chip p">${e(g.estado)}</span>`:''].filter(Boolean).join(' '),m(g.monto))}
  return h+`</div>`};

V.gasto=id=>{
  const g=D.gastos[id]; if(!g)return V.inicio(); const c=CAT[g.padre];
  let h=migas([['Inicio','#/'],[c.nombre,`#/c/${c.id}`],[g.titulo]])+`<header><h1>${e(g.titulo)}</h1><div class="monto-grande">${m(g.monto)}<small>${e(g.fecha)}</small></div></header>
  <section class="caja detalle"><div class="dato"><span>Qué es</span><p>${e(g.detalle)}</p></div><div class="dato"><span>Comprobante</span><p>${e(g.comp)}</p></div>${g.estado?`<div class="dato"><span>Estatus</span><p><span class="chip p">${e(g.estado)}</span></p></div>`:''}</section>`;
  if(g.tickets){const ts=g.tickets.map(i=>D.tickets[i]);const alc=ts.reduce((a,t)=>a+t.alcohol,0);
    h+=`<section><h2>Los ${ts.length} tickets · toca uno para ver el detalle y la foto</h2>`+(alc?`<p class="aviso" style="margin-bottom:8px">Se quitaron ${m(alc)} de alcohol, que no se cobra.</p>`:'')+`<div class="lista">`+
      ts.map(t=>fila(`#/t/${t.id}`,ticketTitulo(t),ticketSub(t)+' '+chipFoto(t),montoTicket(t))).join('')+`<div class="fila"><div class="tx"><b>Suma que se cobra</b></div><div class="m">${m(g.monto)}</div></div></div></section>`}
  if(g.cargos){
    h+=`<section class="caja"><h2>Cómo se revisaron</h2><p>El estado de cuenta trae ${g.cargos.length} cargos por ${m(D.dup.m_tot)}. Cada cargo se comparó con los tickets:</p>
     <ol class="pasos"><li><b>${D.dup.n} cargos (${m(D.dup.m)})</b> son las mismas compras que ya están en un ticket de los lotes (mismo monto y mismo día; en la foto del ticket se ve el pago con tarjeta). Aparecen tachados y no se vuelven a contar; tócalos para ver el ticket.</li>
     <li><b>1 cargo ($1,679.05)</b> es el ticket L4-11 ($179.05, ya contado) más un retiro de efectivo de $1,500 en caja, que no es compra.</li>
     <li><b>${D.dup.n_uni} cargos (${m(D.dup.m_uni)})</b> no tienen ticket en los lotes: esos sí se cuentan aquí.</li></ol></section>
     <section><h2>Los ${g.cargos.length} cargos, día por día</h2><div class="lista">`;
    let dia=null;
    for(const k of g.cargos){
      if(k.fecha!==dia){dia=k.fecha;const cnt=g.cargos.filter(z=>z.fecha===dia&&z.estado==='unico').reduce((a,z)=>a+z.monto,0);h+=`<div class="grupo"><div class="gt">${e(k.fecha_txt)}<span>se cuenta ${m(cnt)}</span></div></div>`}
      if(k.estado==='unico'&&k.ticket)h+=fila(`#/t/${k.ticket}`,'Cargo con su ticket','Se cuenta · '+chipFoto(D.tickets[k.ticket]),m(k.monto));
      else if(k.estado==='unico')h+=fila(null,'Cargo sin ticket en los lotes','Se cuenta',m(k.monto));
      else if(k.estado==='duplicado'){const t=D.tickets[k.ticket];h+=fila(`#/t/${k.ticket}`,`Ya contado en el ticket ${e(k.ticket)}`,`<span class="chip dup">no se suma</span>${e(t.tienda)} · ${e(t.fecha_txt)}`,`<s>${m(k.monto)}</s>`,{off:true})}
      else h+=fila(`#/t/${k.ticket}`,'Ticket L4-11 + retiro de efectivo $1,500','<span class="chip dup">no se suma</span>La compra ya está en el lote 4; el retiro no es compra',`<s>${m(k.monto)}</s>`,{off:true})}
    h+=`<div class="fila"><div class="tx"><b>Se cuenta en el cuadre</b></div><div class="m">${m(g.monto)}</div></div></div></section>`}
  if(g.id==='g15')h+=`<section><h2>Quién cobró</h2><div class="lista">${fila('#/n/2026-09-23','Pagos del 23 de septiembre','Lista por persona','')}${fila('#/n/2026-09-24','Pagos del 24 de septiembre','Lista por persona','')}</div></section>`;
  if(g.id==='g28')h+=`<section><div class="lista">${fila('#/p/082','Ver los pagos de Karen','Folio 082','')}</div></section>`;
  return h};

V.ticket=id=>{
  const t=D.tickets[id]; if(!t)return V.inicio(); const g=D.gastos[t.padre], c=CAT[g.padre];
  const her=t.lote?g.tickets:g.cargos.filter(k=>k.estado==='unico'&&k.ticket).map(k=>k.ticket); const i=her.indexOf(id);
  let h=migas([['Inicio','#/'],[c.nombre,`#/c/${c.id}`],[g.titulo,`#/g/${g.id}`],[t.lote?`Ticket ${id}`:'Ticket']])+
  `<header><div class="eyebrow">${t.lote?`Lote ${t.lote} · ticket ${e(id)}`:'Cargo de tarjeta'}</div><h1>${e(t.tienda)}</h1><p class="lede">${e(ticketSub(t))}</p></header>
  <div class="monto-grande">${m(t.cobra)}<small>${t.alcohol?`Total del ticket ${m(t.total)}; se quitan ${m(t.alcohol)} de alcohol`:'Total del ticket'}</small></div>
  <section class="caja"><h2>Qué se compró</h2><ul class="items">`+
   t.items.map(it=>`<li class="${it.alc?'alc':''}${it.dif?' dif':''}"><span>${it.q&&it.q!==1?(+it.q).toLocaleString('es-MX')+' × ':''}${e(it.c)}${it.alc?'<em>alcohol, no se cobra</em>':''}</span><b>${it.m==null?'':(it.alc?`<s>${m(it.m)}</s>`:m(it.m))}</b></li>`).join('')+
   `<li class="tot"><span>Total impreso</span><b>${m(t.total)}</b></li></ul>`+
   (t.folio?`<p class="lede" style="font-size:13px">Folio: ${e(t.folio)}</p>`:'')+(t.nota?`<p class="lede" style="font-size:13px">${e(t.nota)}</p>`:'')+`</section>`;
  if(t.en_estado)h+=`<p class="info">Este pago también aparece en el estado de cuenta de la tarjeta (${e(t.en_estado.fecha_txt)}, ${m(t.en_estado.monto)})${t.en_estado.retiro?', junto con un retiro de efectivo de $1,500 que no es compra':''}. Se cuenta una sola vez: aquí, en el ticket.</p>`;
  h+=t.foto?`<figure class="foto"><button type="button" data-foto="${t.foto}" aria-label="Ver la foto en grande"><img src="${t.foto}" alt="Foto del ticket de ${e(t.tienda)}, ${e(t.fecha_txt)}"></button><figcaption>Toca la foto para verla en grande.</figcaption></figure>`:'<p class="lede">Este ticket no tiene foto.</p>';
  h+=`<nav class="nav2">${i>0?`<a href="#/t/${her[i-1]}">‹ <small>Anterior</small></a>`:'<span></span>'}${i<her.length-1?`<a href="#/t/${her[i+1]}"><small>Siguiente</small> ›</a>`:'<span></span>'}</nav>`;
  return h};

function pagosLista(ps,porPersona){
  const by={};for(const p of ps){(by[p.folio]=by[p.folio]||{folio:p.folio,nombre:p.nombre,items:[],t:0});by[p.folio].items.push(p);by[p.folio].t+=p.monto}
  return '<div class="lista">'+Object.values(by).sort((a,b)=>a.folio.localeCompare(b.folio)).map(x=>fila(`#/p/${x.folio}`,e(x.nombre),`Folio ${e(x.folio)} · `+x.items.map(p=>e(p.concepto)+' '+m(p.monto)).join(' + '),m(x.t))).join('')+'</div>'}
V.nom=f=>{
  const d=D.dias_n.find(x=>x.fecha===f); const ps=D.pagos.filter(p=>p.dia===f); const c=CAT['nomina-diaria'];
  const titulo=d?d.fecha_txt:(f==='2026-09-24'?'Miércoles 24 sep':f);
  let h=migas([['Inicio','#/'],[c.nombre,'#/c/nomina-diaria'],[titulo]])+`<header><h1>Nómina del ${e(titulo.toLowerCase())}</h1>`;
  if(d)h+=`<div class="monto-grande">${m(d.total)}<small>${d.personas?`${d.personas} promotores × $400 = ${m(d.turnos)}`+(d.extras?` + extras ${m(d.extras)} (coordinación, puntualidad, referidos o suplentes)`:''):'Capacitación: $200 por persona'}</small></div>`;
  h+=`</header>`;
  if(d&&d.nota)h+=`<p class="info">${e(d.nota)}</p>`;
  if(f==='2026-09-23'||f==='2026-09-24')h+=`<p class="aviso">El 23 y el 24 se pagaron ${m(D.liq+D.d23)} en total: ${m(D.d23)} están en la nómina diaria del 23 y ${m(D.liq)} en la <a href="#/g/g15">liquidación final</a>. Abajo está la lista completa de ese día según el sistema de nómina.</p>`;
  h+=`<section><h2>Quién cobró ese día, según el sistema de nómina (${new Set(ps.map(p=>p.folio)).size} personas, contando coordinación y suplentes · ${m(ps.reduce((a,p)=>a+p.monto,0))})</h2><p class="lede" style="margin-bottom:8px">Toca un nombre para ver todos sus pagos.</p>${pagosLista(ps)}</section>`;
  return h};
V.personas=()=>{const c=CAT['nomina-diaria'];
  return migas([['Inicio','#/'],[c.nombre,'#/c/nomina-diaria'],['Por persona']])+`<header><h1>Pago por persona</h1><div class="monto-grande">${m(D.tot_personas)}<small>${D.personas.length} personas. Incluye la nómina diaria (${m(c.total)}) y la liquidación final (${m(D.liq)}).</small></div></header>
  <nav class="tabs"><a href="#/c/nomina-diaria">Por día</a><a class="on" href="#/personas">Por persona</a></nav>
  <div class="lista">${D.personas.map(p=>fila(`#/p/${p.folio}`,e(p.nombre),`Folio ${e(p.folio)} · ${p.dias} días trabajados`,m(p.total))).join('')}</div>`};
V.persona=fo=>{const p=D.personas.find(x=>x.folio===fo); if(!p)return V.personas(); const ps=D.pagos.filter(x=>x.folio===fo).sort((a,b)=>a.dia.localeCompare(b.dia)); const c=CAT['nomina-diaria'];
  return migas([['Inicio','#/'],[c.nombre,'#/c/nomina-diaria'],['Por persona','#/personas'],[p.nombre]])+`<header><div class="eyebrow">Folio ${e(p.folio)}</div><h1>${e(p.nombre)}</h1><div class="monto-grande">${m(p.total)}<small>${p.dias} días trabajados</small></div></header>
  <div class="lista">${ps.map(x=>{const d=D.dias_n.find(z=>z.fecha===x.dia);return fila(`#/n/${x.dia}`,e(x.concepto),e(d?d.fecha_txt:x.dia),m(x.monto))}).join('')}</div>`};
V.via=f=>{const d=D.dias_v.find(x=>x.fecha===f); if(!d)return V.cat('viaticos'); const c=CAT['viaticos'];
  return migas([['Inicio','#/'],[c.nombre,'#/c/viaticos'],[d.fecha_txt]])+`<header><h1>Viáticos del ${e(d.fecha_txt.toLowerCase())}</h1><div class="monto-grande">${m(d.total)}</div></header>
  <section class="caja"><ul class="items">${d.partes.map(p=>`<li><span>${e(p.c)}${p.n?` <small style="color:var(--tinta-2)">(${e(p.n)})</small>`:''}</span><b>${m(p.m)}</b></li>`).join('')}<li class="tot"><span>Total del día</span><b>${m(d.total)}</b></li></ul>${d.nota?`<p class="lede" style="font-size:13px">${e(d.nota)}</p>`:''}</section>
  <p class="lede">Uber y comidas sin ticket: monto declarado por Alberto. Oxxo / 7-Eleven: cargos de tarjeta del estado de cuenta.</p>`};

function ruta(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,'')); const [a,b]=h.split('/');
  let html;
  if(!a)html=V.inicio(); else if(a==='depositos')html=V.depositos(); else if(a==='c')html=V.cat(b); else if(a==='g')html=V.gasto(b);
  else if(a==='t')html=V.ticket(b); else if(a==='n')html=V.nom(b); else if(a==='personas')html=V.personas(); else if(a==='p')html=V.persona(b);
  else if(a==='v')html=V.via(b); else html=V.inicio();
  $('#app').innerHTML=html; cerrarVisor(true); window.scrollTo(0,0);
  const h1=$('#app h1'); document.title=(a?(h1?h1.textContent+' · ':''):'')+'Cuadre · Activación Fresko Cumbres';
}
const vis=$('#visor'),vi=$('#vi');
function abrirVisor(src){vi.src=src;$('#va').href=src;vis.classList.add('on');vis.classList.remove('zoom');$('#vz').textContent='Acercar';document.body.style.overflow='hidden';history.pushState({visor:1},'');}
function cerrarVisor(silencio){if(!vis.classList.contains('on'))return;vis.classList.remove('on');document.body.style.overflow='';if(!silencio&&history.state&&history.state.visor)history.back();}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-foto]');if(b){ev.preventDefault();abrirVisor(b.getAttribute('data-foto'))}});
$('#vc').onclick=()=>cerrarVisor(false);
$('#vz').onclick=()=>{vis.classList.toggle('zoom');$('#vz').textContent=vis.classList.contains('zoom')?'Alejar':'Acercar'};
window.addEventListener('popstate',()=>{if(vis.classList.contains('on')&&!(history.state&&history.state.visor)){vis.classList.remove('on');document.body.style.overflow=''}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')cerrarVisor(false)});
window.addEventListener('hashchange',ruta);
ruta();
</script>
</body>
</html>
