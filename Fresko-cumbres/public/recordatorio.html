<html lang="es-MX">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0B5D2E; --verde-2:#2E9E4F; --lima:#A8DC1E; --naranja:#F2681F; --wa:#25D366;
  --arena:#FFF6EC; --panel:#fff; --tinta:#14231A; --tinta-2:#5A6B60; --tinta-3:#8A968D;
  --linea:#E7DFD4; --linea-2:#D3C8B8; --error:#C2321B; --radio:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89;
}}
:root[data-theme="dark"]{
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89;
}
*{box-sizing:border-box}
body{margin:0;background:var(--arena);color:var(--tinta);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
button,a.btn{font:inherit;cursor:pointer;text-decoration:none}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 6px}
input{width:100%;padding:13px;font:inherit;font-size:16px;color:var(--tinta);background:var(--panel);
  border:1.5px solid var(--linea-2);border-radius:var(--radio)}
input:focus{outline:2px solid var(--verde-2);outline-offset:1px}

#acceso{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.caja{width:100%;max-width:370px;background:var(--panel);border:1px solid var(--linea);
  border-radius:18px;padding:26px 24px}
.caja h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.caja .sub{margin:0 0 18px;color:var(--tinta-2);font-size:14px}
.principal{width:100%;margin-top:18px;padding:14px;background:var(--verde);color:#fff;border:none;
  border-radius:var(--radio);font-weight:700;font-size:16.5px}
.msg{margin-top:12px;font-size:14px;font-weight:600;color:var(--error);display:none}
.msg.on{display:block}

#app{display:none}
header{background:var(--verde);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.head-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.h-tit{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#BFE6CB;font-weight:600}
.marcador{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;line-height:1;
  font-variant-numeric:tabular-nums}
.marcador small{font-size:14px;font-weight:400;color:#BFE6CB}
.h-der{display:flex;gap:8px;align-items:center}
.salir,.enlace{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;
  padding:6px 13px;font-size:13px;font-weight:600;display:inline-block}

.pestanas{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.pes{background:var(--panel);border:1.5px solid var(--linea-2);color:var(--tinta-2);border-radius:99px;
  padding:9px 15px;font-weight:600;font-size:14px;white-space:nowrap}
.pes[aria-selected="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.pes .n{font-variant-numeric:tabular-nums}
.pes.urgente{border-color:var(--naranja);color:var(--naranja)}
.pes.urgente[aria-selected="true"]{background:var(--naranja);border-color:var(--naranja);color:#fff}

.explica{margin:14px 0 0;padding:13px 15px;background:var(--panel);border:1px solid var(--linea);
  border-radius:var(--radio);font-size:14px;color:var(--tinta-2);line-height:1.55}
.explica b{color:var(--tinta)}

.lista{margin-top:12px;display:grid;gap:9px}
.fila{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px}
.fila.hecho{border-color:var(--verde);background:color-mix(in srgb, var(--verde) 7%, var(--panel))}
.f1{display:flex;gap:11px;align-items:center}
.folio{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;color:var(--verde);
  font-variant-numeric:tabular-nums;flex:none;min-width:34px}
.nm{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tel{font-size:12.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums;flex:none}
.acciones{display:flex;gap:7px;margin-top:10px}
.acciones a,.acciones button{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:700;
  font-size:14px;border:none}
.b-wa{background:var(--wa);color:#0A2E17}
.b-ref{background:transparent;color:var(--verde);border:1.5px solid var(--linea-2)!important}
.marcada{margin-top:8px;font-size:13px;color:var(--verde);font-weight:700;display:none}
.fila.hecho .marcada{display:block}
.vacio{padding:30px 14px;text-align:center;color:var(--tinta-3);font-size:15px;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio)}
.aviso{margin-top:12px;padding:12px 14px;border-radius:var(--radio);font-size:14px;font-weight:600;display:none}
.aviso.on{display:block}
.aviso.err{background:#FAE5E0;color:var(--error)}
.aviso.ok{background:#DCEFE2;color:#0B5D2E}
.pie{margin-top:18px;font-size:12.5px;color:var(--tinta-3);line-height:1.6}

    <h1>Recordatorios</h1>

      La fila se marca en verde cuando ya la abriste, para que no repitas.</p>
  </div>
</div>

// Calcula el día de hoy en palabras, para no quemar fechas en el texto
// y que el mensaje no se venza de un día para otro.
function hoyTexto() {
  const d = new Date();
  return d.toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });
}

// "2026-09-24" en hora local. new Date("2026-09-24") la leería como UTC y en
// Monterrey caería un día antes.
function comoFecha(s) { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); }
const enIso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// Días de trabajo que faltan, contando hoy y saltándose los descansos. Se
// calcula al vuelo para que el mensaje no envejezca de un día para otro.
function diasQuedan() {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = comoFecha(FIN);
  const descansos = new Set(DESCANSOS);
  let n = 0;
  for (const d = new Date(hoy); d <= fin; d.setDate(d.getDate() + 1)) {
    if (!descansos.has(enIso(d))) n++;
  }
  return n;
}

function finTexto() {
  return comoFecha(FIN).toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });
}

// Para todos: la activación sigue viva y todavía se puede entrar. Se adapta
// según si la persona ya está inscrita o no.

    ``,
    `🕐 De 1:00 a 7:00 de la tarde`,
    `📍 Entrada del fraccionamiento, sobre Av. Paseo de los Leones, junto al Fresko`,
    `💵 $400 el día, en efectivo, a la mañana siguiente`,
    `➕ $50 cada día que llegues a tiempo`,
    `➕ $50 por cada persona que invites y se registre con tu folio`,
    ``
  );
  const pasos = c.en_etapa2
    ? pila(
        `Tú ya estás dentro con el folio ${c.folio}. Solo llega y marca tu entrada aquí:`,
        `${SITIO}/presente?f=${c.folio}`,
        ``,
        `Y aquí ves tus días, tu bono y tu lugar:`,
        `${SITIO}/milugar?f=${c.folio}`,
        ``,
        `El grupo del equipo, por si todavía no estás:`,
        GRUPO
      )
    : pila(
        `Te lo digo de frente: *quedan pocos lugares* y van por orden de quien se apunta. No te prometo uno, pero si te apartas hoy tienes con qué pelearlo, y quedas de primero para las suplencias y para lo que viene.`,
        ``,
        `*1) Apártate aquí.* Son dos minutos: subes tu INE desde el celular y te da tu folio al momento.`,
        `${SITIO}/`,
        ``,
        `*2) Mira en qué lugar vas*, con tu folio ${c.folio} y los últimos 4 de tu teléfono.`,
        `${SITIO}/milugar?f=${c.folio}`,
        ``,
        `*3) Éntrale al grupo del equipo*, ahí aviso todo.`,
        GRUPO
      );
  return pila(
    cabeza,
    pasos,
    ``,
    `Lleva tu INE, pantalón de mezclilla azul y tenis. Playera, gorra, mandil y agua los ponemos nosotros.`,
    ``,
    `— Alberto Balderas`
  );
}

// Para el equipo que ya está dentro.

    ``,
    `Tu folio sigue siendo el ${c.folio}. Regístrate aquí para apartar:`,
    `${SITIO}/`,
    ``,
    `Es rápido: ya te conocemos, solo subes la foto de tu INE y quedas.`,
    ``,
    `— Alberto Balderas`
  );

// Para quienes ya están en el equipo: agradecer y recordar la jornada de hoy.

  return pila(

// Para quienes se registraron pero nunca llegaron. El gancho es que
// ya no hace falta comprometerse a los 5 días: vienen los que puedan.

    `${nombrePila(c.nombre)}, te aparté un lugar 👋`,

    ``,
    `Y quité el requisito que a lo mejor te frenó: *ya no tienes que venir los 5 días*. Ven los días que puedas, aunque sea uno.`,
    ``,
    `💵 $400 por cada día que trabajes. Te los pago a la mañana siguiente, en efectivo, cuando llegas.`,
    `➕ $50 más por cada día que llegues puntual.`,
    `➕ $50 por cada persona que traigas.`,
    `🕘 De 9:00 a.m. a 3:00 p.m.`,
    ``,
    `📍 FRESKO VALLE DE CUMBRES`,
    `Mitras Poniente, C.P. 66035, Monterrey`,
    `https://maps.app.goo.gl/BKYH7zbtHEbzUeHd7`,
    ``,

    ``,
    `Contéstame qué días puedes y te digo a qué hora te espero.`,

}

    `🕞 Sale a las 3:30 p.m. y otra vuelta a las 3:45 p.m. No hay más salidas, no llegues tarde.`,

    `📱 Rolando Barrios: 55 8233 8504`,
    ``,

// Para quienes vinieron a la capacitación pero nunca se presentaron. Ya
// tiene su uniforme y la oportunidad de venir en cualquier momento hasta
// el cierre de la activación.

  return pila(
    `${nombrePila(c.nombre)}, te escribo porque viniste a la capacitación del 8 de septiembre.`,
    ``,
    `Sabemos que la vida es complicada y no todos los días se puede. Pero la activación sigue viva hasta el *24 de septiembre*, y todavía necesitamos gente.`,
    ``,
    `*Tú ya tienes tu uniforme* — lo recibiste el martes. Solo trae lo que le falta:`,
    `👖 Pantalón de mezclilla azul`,
    `👟 Tenis`,
    ``,
    `*El turno es de 1:00 a 7:00 de la tarde*, a partir de mañana domingo hasta el 24.`,
    `📍 Entrada del fraccionamiento, sobre Av. Paseo de los Leones, junto al Fresko`,
    ``,
    `💵 $400 cada día, en efectivo a la mañana siguiente`,
    `➕ $50 si llegas a tiempo (1:00 a 2:00)`,
    `➕ $50 por cada persona que invites y se registre`,
    ``,
    `Si cambias de opinión y quieres intentarlo, solo ven. No hay que inscribirse ni confirmar nada. Llega, marca tu entrada desde tu celular aquí, y listo:`,
    `${SITIO}/presente`,
    ``,
    `Eso es todo. Nos vemos en la calle.`,
    ``,
    `— Alberto Balderas`

}

const wa = (tel, texto) =>
  `https://wa.me/52${String(tel||"").replace(/\D/g,"").slice(-10)}?text=${encodeURIComponent(texto)}`;

/* ---------- pintar ---------- */
const TEXTOS = {
  quedan: "Solo para <b>quien ya trabajó</b> con nosotros, en cualquiera de las dos etapas — quedan pocos lugares y no da para convocar a todo el padrón. Avisa cuántos días de trabajo faltan. A quien ya está dentro le manda su enlace para marcar entrada; a quien no, le dice de frente que los lugares son pocos y le da las ligas de <b>registro</b>, <b>su lugar</b> y el <b>grupo del equipo</b>.",
  hoy:"Los <b>inscritos</b>. Les recuerda el horario y el punto, y les manda su enlace directo para <b>marcar entrada</b> y otro para <b>ver cómo van</b>.",
  sumarse: "Los <b>siguientes en la fila</b> que aún no se inscriben. Les da las dos ligas: <b>registrarse</b> y <b>ver su lugar</b>, con las reglas a la vista.",
  etapa2: "Los que <b>sí trabajaron</b> la Etapa 1 y todavía no están inscritos en la Etapa 2. El mensaje les dice el horario nuevo y que <b>solo hay 15 lugares + 2 suplentes</b>, sin prometerles lo que no hay.",
  gracias: "Los que <b>sí llegaron a la capacitación</b>. El mensaje les agradece y les recuerda la jornada de hoy: horario, lugar, cómo ir vestidos y su folio para pasar lista.",
  unete: "Se registraron pero <b>nunca llegaron</b>. El mensaje los invita a entrar todavía, con los $400 por día y los bonos, y les pide contestar <b>VOY</b> para que tú les digas desde qué día los metes.",
  pendientes: "Estas personas <b>todavía no confirman</b>. El mensaje trae su enlace de un clic: en cuanto lo abran, quedan confirmadas y lo ves aquí al recargar.",
  confirmados: "Estas ya confirmaron. El mensaje les dice que <b>ya las tienes consideradas</b> y les repite la hora, el lugar y qué llevar.",
  referidos: "Mándale a cada quien <b>su enlace de referido</b> para que lo comparta en redes. Aplica para todos, hayan confirmado o no.",
  capacitacion: "Vinieron a la <b>capacitación del 8</b> pero nunca se presentaron. Ya tienen <b>uniforme y la oportunidad</b> de venir en cualquier momento hasta el cierre de la activación. El mensaje les dice que pueden intentarlo sin inscripción ni confirmación.",
  ubicacion: "⚠️ Aclara <b>a cuál Fresko</b> tienen que llegar. Va para <b>todos</b>, hayan confirmado o no.",
  transporte: "🚌 Avisa del <b>transporte gratis desde Plaza Puerta de Hierro</b> (salidas 3:30 y 3:45) y les pide contestar TRANSPORTE o DIRECTO. Va para <b>todos</b>."
};

function mensajeDe(c) {
  if (VISTA === "quedan")  return msgQuedanDias(c);
  if (VISTA === "hoy")     return msgHoy(c);
  if (VISTA === "sumarse") return msgSumarse(c);
  if (VISTA === "etapa2")       return msgEtapa2(c);
  if (VISTA === "gracias")      return msgGracias(c);
  if (VISTA === "unete")        return msgUnete(c);
  if (VISTA === "pendientes")   return msgPendiente(c);
  if (VISTA === "confirmados")  return msgConfirmado(c);
  if (VISTA === "capacitacion")  return msgCapacitacion(c);
  if (VISTA === "ubicacion")    return msgUbicacion(c);
  if (VISTA === "transporte")   return msgTransporte(c);
  return msgReferido(c);
}

function pintar() {
  $("#explica").innerHTML = TEXTOS[VISTA];
  const marcas = leerMarcas();
  let l;
  // Solo quien ya trabajó con nosotros, en cualquiera de las dos etapas:
  // quedan pocos lugares y no da para convocar a todo el padrón.
  if (VISTA === "quedan") l = GENTE.filter((c) => Number(c.dias_totales) > 0);
  else if (VISTA === "hoy") l = GENTE.filter((c) => c.en_etapa2);
  else if (VISTA === "sumarse") l = GENTE.filter((c) => !c.en_etapa2 && c.lugar && c.lugar <= 30);
  else if (VISTA === "etapa2") l = GENTE.filter((c) => Number(c.dias_trabajados) > 0 && !c.en_etapa2);
  else if (VISTA === "pendientes") l = GENTE.filter((c) => !c.confirmo);
  else if (VISTA === "confirmados") l = GENTE.filter((c) => c.confirmo);
  else if (VISTA === "gracias") l = GENTE.filter((c) => c.asistio);
  else if (VISTA === "capacitacion") l = GENTE.filter((c) => c.asistio && Number(c.dias_totales) === 0);
  else if (VISTA === "unete") l = GENTE.filter((c) => !c.asistio);
  else l = GENTE;

  if (!l.length) {
    $("#lista").innerHTML = `<div class="vacio">${
      VISTA === "pendientes" ? "¡Ya confirmaron todos! 🎉" :
      VISTA === "gracias"    ? "Todavía nadie pasó por la capacitación." :
      VISTA === "unete"      ? "Todos los registrados ya están dentro. 🎉" :
      "Todavía nadie por aquí."}</div>`;
    return;
  }

  $("#lista").innerHTML = l.map((c) => {
    const texto = mensajeDe(c);
    const clave = `${VISTA}:${c.folio}`;
    return `<div class="fila ${marcas[clave] ? "hecho" : ""}" data-clave="${esc(clave)}">
      <div class="f1">
        <span class="folio">${esc(c.folio)}</span>
        <span class="nm">${esc(c.nombre)}</span>
        <span class="tel">${esc(c.telefono)}</span>
      </div>
      <div class="acciones">
        <a class="b-wa" href="${esc(wa(c.telefono, texto))}" target="_blank" rel="noopener"
           data-abrir="${esc(clave)}">Abrir en WhatsApp</a>
        <button class="b-ref" type="button" data-copiar="${esc(clave)}">Copiar</button>
      </div>
      <div class="marcada">✓ Ya lo abriste</div>
    </div>`;
  }).join("");
}

$("#lista").addEventListener("click", async (ev) => {
  const a = ev.target.closest("[data-abrir]");
  if (a) { marcar(a.dataset.abrir); a.closest(".fila").classList.add("hecho"); return; }

  const b = ev.target.closest("[data-copiar]");
  if (!b) return;
  const folio = b.dataset.copiar.split(":")[1];
  const c = GENTE.find((x) => x.folio === folio);
  if (!c) return;
  const texto = mensajeDe(c);
  try { await navigator.clipboard.writeText(texto); avisar(`Mensaje de ${c.folio} copiado ✓`, "ok"); }
  catch (e) { avisar("No se pudo copiar en este navegador.", "err"); }
});

document.querySelectorAll(".pes").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".pes").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  VISTA = b.dataset.v;
  pintar();
}));

async function cargar() {
  const [gente, par] = await Promise.all([
    // Las pestañas filtran por en_etapa2, lugar y dias_trabajados: si no se
    // piden aquí, llegan como undefined y esas listas salen vacías siempre.
    traer("v_confirmacion?select=folio,nombre,telefono,confirmo,asistio,dias_trabajados,dias_totales,en_etapa2,vino_hoy,lugar&order=folio.asc"),
    Promise.resolve([])
  ]);
  GENTE = gente;
  const conf = GENTE.filter((c) => c.confirmo).length;
  $("#nConf").textContent = conf;
  $("#nTot").textContent = GENTE.length;
  $("#cConf").textContent = conf;
  const cQ = $("#cQued");
  if (cQ) cQ.textContent = GENTE.filter((c) => Number(c.dias_totales) > 0).length;
  const cE = $("#cE2");
  if (cE) cE.textContent = GENTE.filter((c) => Number(c.dias_trabajados) > 0 && !c.en_etapa2).length;
  const cCap = $("#cCap");
  if (cCap) cCap.textContent = GENTE.filter((c) => c.asistio && Number(c.dias_totales) === 0).length;
  const cH = $("#cHoy"), cS = $("#cSum");
  if (cH) cH.textContent = GENTE.filter((c) => c.en_etapa2).length;
  if (cS) cS.textContent = GENTE.filter((c) => !c.en_etapa2 && c.lugar && c.lugar <= 30).length;
  $("#cPend").textContent = GENTE.length - conf;
  const equipo = GENTE.filter((c) => c.asistio).length;
  $("#cGrac").textContent = equipo;
  $("#cUne").textContent  = GENTE.length - equipo;
  pintar();
}

$("#fLogin").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = $("#btnEntrar"), m = $("#msgLogin");
  b.disabled = true; b.textContent = "Entrando…"; m.classList.remove("on");
  try {
    SESION = await entrar($("#email").value.trim(), $("#pass").value);
    guardar(SESION); await arrancar();
  } catch (e) {
    m.textContent = e.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : e.message;
    m.classList.add("on");
  } finally { b.disabled = false; b.textContent = "Entrar"; }
});

$("#btnSalir").addEventListener("click", () => { borrar(); location.reload(); });

async function arrancar() {
  await cargar();
  $("#acceso").style.display = "none";
  $("#app").style.display = "block";
}

(async () => {
  const s = leerSes();
  if (!s) return;
  SESION = s;
  try { await arrancar(); } catch (e) { borrar(); }
})();
</script>
</body>
