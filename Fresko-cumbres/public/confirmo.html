<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B5D2E">
<title>Confirmar mi lugar · Fresko Valle de Cumbres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0B5D2E; --verde-2:#2E9E4F; --lima:#A8DC1E; --naranja:#F2681F;
  --arena:#FFF6EC; --panel:#fff; --tinta:#14231A; --tinta-2:#5A6B60; --tinta-3:#8A968D;
  --linea:#E7DFD4; --linea-2:#D3C8B8; --error:#C2321B; --radio:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89;
}}
:root[data-theme="dark"]{
  --arena:#12160F; --panel:#1A2018; --tinta:#EAF0E7; --tinta-2:#AFBCB0; --tinta-3:#7E8C81;
  --linea:#2A332A; --linea-2:#3A463A; --verde:#6FBF89;
}
*{box-sizing:border-box}
body{margin:0;background:var(--arena);color:var(--tinta);min-height:100dvh;
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px 44px}
button,a.btn{font:inherit;cursor:pointer;text-decoration:none;display:block;text-align:center}

.cargando{min-height:70dvh;display:grid;place-items:center;color:var(--tinta-3);font-size:15px}

/* sello de confirmación */
.sello{background:var(--verde);color:#fff;border-radius:22px;padding:26px 22px 24px;text-align:center;
  position:relative;overflow:hidden}
.sello::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:120px;background:var(--lima);
  opacity:.16;border-radius:50%}
.palomita{width:64px;height:64px;border-radius:50%;background:var(--lima);color:#0B3D1E;
  display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 12px;
  font-family:"Bricolage Grotesque",sans-serif;position:relative;z-index:1}
.sello h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:27px;line-height:1.1;
  margin:0 0 6px;letter-spacing:-.02em;position:relative;z-index:1}
.sello p{margin:0;color:#CFEBD8;font-size:15px;position:relative;z-index:1}
.folio-chip{display:inline-block;margin-top:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.28);
  border-radius:99px;padding:7px 16px;font-size:14px;font-weight:700;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;position:relative;z-index:1}
.sello.pendiente{padding-top:30px}
.btn-si{width:100%;margin-top:20px;background:var(--lima);color:#0B3D1E;border:none;
  border-radius:var(--radio);padding:17px;font-weight:800;font-size:18px;
  font-family:"Bricolage Grotesque",sans-serif;position:relative;z-index:1}
.btn-si:disabled{opacity:.7}

/* tarjeta de la cita */
.cita{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);
  margin-top:14px;padding:6px 18px 18px}
.dato{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linea)}
.dato:last-child{border-bottom:none}
.ico{width:34px;height:34px;border-radius:10px;background:var(--arena);display:grid;place-items:center;
  font-size:17px;flex:none}
.dato .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-3);font-weight:700}
.dato .v{font-weight:700;font-size:16px;margin-top:1px}
.dato .v small{display:block;font-weight:400;font-size:14px;color:var(--tinta-2);margin-top:2px}
.dato a{color:var(--verde);font-weight:600}

.btn-mapa{margin-top:14px;background:var(--naranja);color:#fff;border:none;border-radius:var(--radio);
  padding:15px;font-weight:700;font-size:16.5px}
.btn-cal{margin-top:9px;background:transparent;color:var(--verde);border:1.5px solid var(--linea-2);
  border-radius:var(--radio);padding:13px;font-weight:600;font-size:15px}

/* referidos */
.invita{margin-top:18px;background:var(--panel);border:2px solid var(--lima);border-radius:var(--radio);padding:18px}
.invita h2{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.invita p{margin:0 0 12px;font-size:14.5px;color:var(--tinta-2)}
.liga{display:flex;gap:8px;align-items:center;background:var(--arena);border:1px solid var(--linea);
  border-radius:11px;padding:11px 13px;font-size:13.5px;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.liga button{flex:none;background:var(--verde);color:#fff;border:none;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:700}
.btn-wa{margin-top:10px;background:#25D366;color:#0A2E17;border:none;border-radius:var(--radio);
  padding:14px;font-weight:700;font-size:16px}
.btn-redes{margin-top:9px;background:transparent;color:var(--verde);border:1.5px solid var(--linea-2);
  border-radius:var(--radio);padding:13px;font-weight:600;font-size:15px}
.copiado{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--verde);display:none;text-align:center}
.copiado.on{display:block}

.pie{margin-top:20px;font-size:12.5px;color:var(--tinta-3);text-align:center;line-height:1.6}

/* error */
.malo{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:26px 22px;
  text-align:center;margin-top:30px}
.malo h1{font-family:"Bricolage Grotesque",sans-serif;font-size:23px;margin:0 0 8px}
.malo p{margin:0 0 16px;color:var(--tinta-2);font-size:15px}
.malo a.btn{background:var(--verde);color:#fff;border-radius:var(--radio);padding:14px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="cargando">Confirmando tu lugar…</div></div>

<script>
const SUPABASE_URL = "https://eykfdnoczpwjccunzfgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q_fNBD3xtsMtsNtpp3h0wg_j3dkROng";
const SITIO = "https://fresko-cumbres.abdev.click";
const MAPA = "https://maps.app.goo.gl/BKYH7zbtHEbzUeHd7";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const params = new URLSearchParams(location.search);
const FOLIO = (params.get("f") || params.get("folio") || "").trim();

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json" },
    body: JSON.stringify(body || {})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || `error ${r.status}`);
  return d;
}

function error(titulo, texto) {
  $("#app").innerHTML = `<div class="malo"><h1>${esc(titulo)}</h1><p>${texto}</p>
    <a class="btn" href="${SITIO}/">Ir al registro</a></div>`;
}

function pintar(d) {
  const mi = `${SITIO}/?ref=${d.folio}`;
  const invita =
`Oye, ¿andas buscando trabajo esta semana? Voy a estar en la activación de la inauguración del Fresko Valle de Cumbres y todavía hay lugares.

Son 5 días, del 9 al 13 de septiembre, de 9 a 3 de la tarde. Pagan $400 el día y te lo dan a la mañana siguiente, más $200 nada más por ir a la capacitación del martes. La playera, gorra y mandil los ponen ellos.

No piden experiencia, nomás INE y que puedas los 5 días completos.

Si le entras, regístrate aquí y te dan tu folio de una vez:
${mi}

La cita es el martes 8 a las 4 de la tarde en el Fresko Valle de Cumbres, en Mitras Poniente. Llévate tu INE original.`;

  const cal = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(`Capacitación activación Cumbres · folio ${d.folio}`) +
    "&dates=20260908T220000Z/20260908T230000Z" +
    "&location=" + encodeURIComponent("Fresko Valle de Cumbres, Fresko Valle de Cumbres — Mitras Poniente, 66035, Monterrey") +
    "&details=" + encodeURIComponent("Lleva tu INE original. Pantalón de mezclilla azul y tenis.");

  const hecho = d.confirmado === true;

  $("#app").innerHTML = `
    <div class="sello ${hecho ? "" : "pendiente"}">
      ${hecho ? `<div class="palomita">✓</div>` : ``}
      <h1>${hecho
        ? (d.ya_estaba ? "Ya estabas confirmado" : "¡Listo, " + esc(d.nombre) + "!")
        : "Hola, " + esc(d.nombre)}</h1>
      <p>${hecho
        ? (d.ya_estaba ? "Tu lugar sigue apartado. Te esperamos mañana."
                       : "Tu lugar quedó apartado para la capacitación.")
        : "Confirma que sí vas a la capacitación para apartarte el lugar."}</p>
      <div class="folio-chip">FOLIO ${esc(d.folio)}</div>
      ${hecho ? `` : `<button class="btn-si" type="button" id="siVoy">✅ Sí voy, apártame el lugar</button>`}
    </div>

    <div class="cita">
      <div class="dato"><div class="ico">🗓️</div><div>
        <div class="k">Cuándo</div>
        <div class="v">Martes 8 de septiembre, 4:00 p.m.<small>Llega unos minutos antes</small></div></div></div>
      <div class="dato"><div class="ico">📍</div><div>
        <div class="k">Dónde</div>
        <div class="v">Fresko VALLE DE CUMBRES<small>Mitras Poniente, C.P. 66035, Monterrey</small>
          <small><b>Ojo:</b> no es el Fresko de Paseo de los Leones / Cumbres Mediterráneo.</small>
          <small>En camión: Ruta Cumbres C29, bájate en Plaza Puerta de Hierro y camina 500 m sobre Av. Paseo de los Leones</small></div></div></div>
      <div class="dato"><div class="ico">🪪</div><div>
        <div class="k">Qué llevar</div>
        <div class="v">Tu INE original<small>Y tu folio ${esc(d.folio)}${d.talla ? ` · talla ${esc(d.talla)}` : ""}</small></div></div></div>
      <div class="dato"><div class="ico">👖</div><div>
        <div class="k">Cómo vestir</div>
        <div class="v">Pantalón de mezclilla azul y tenis<small>Playera, gorra y mandil los damos nosotros</small></div></div></div>
      <div class="dato"><div class="ico">💵</div><div>
        <div class="k">Ese mismo día</div>
        <div class="v">Te pagamos $200 por asistir<small>Los $400 de cada jornada se pagan a la mañana siguiente</small></div></div></div>

      <a class="btn btn-mapa" href="${MAPA}" target="_blank" rel="noopener">Abrir en el mapa</a>
      <a class="btn btn-cal" href="${esc(cal)}" target="_blank" rel="noopener">Agendar recordatorio</a>
    </div>

    <div class="invita" ${hecho ? "" : `style="display:none"`} id="invita">
      <h2>¿Conoces a alguien que quiera entrar?</h2>
      <p>Este es tu enlace. Quien se registre por ahí queda ligado a tu folio, y te pagamos
         <b>$50 por cada persona</b> que llegue el martes. Se te entrega el último día.</p>
      <div class="liga"><span>${esc(mi)}</span><button type="button" id="copiar">Copiar</button></div>
      <a class="btn btn-wa" id="wa" href="https://wa.me/?text=${encodeURIComponent(invita)}"
         target="_blank" rel="noopener">Compartir por WhatsApp</a>
      <button class="btn-redes" type="button" id="redes">Compartir en redes</button>
      <p class="copiado" id="copiado"></p>
    </div>

    <p class="pie">Si ya no vas a poder venir, avísale a Alberto por WhatsApp para darle
      tu lugar a alguien más. Gracias 🙌</p>`;

  const aviso = (t) => {
    const c = $("#copiado");
    c.textContent = t; c.classList.add("on");
    setTimeout(() => c.classList.remove("on"), 2600);
  };

  $("#copiar").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(mi); aviso("Enlace copiado ✓"); }
    catch (e) { aviso("Copia el enlace de arriba a mano."); }
  });

  const btn = $("#redes");
  if (navigator.share) {
    btn.addEventListener("click", async () => {
      try { await navigator.share({ title:"Activación Fresko Valle de Cumbres", text: invita, url: mi }); }
      catch (e) { /* canceló */ }
    });
  } else {
    btn.textContent = "Copiar mensaje para redes";
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(invita); aviso("Mensaje copiado ✓ pégalo donde quieras"); }
      catch (e) { aviso("No se pudo copiar."); }
    });
  }

  // Solo cuando la persona toca el botón se escribe la confirmación.
  const si = $("#siVoy");
  if (si) si.addEventListener("click", async () => {
    si.disabled = true; si.textContent = "Apartando tu lugar…";
    try {
      const r = await rpc("confirmar_cita", { p: { folio: d.folio, origen: "enlace" } });
      if (!r.ok) throw new Error(r.motivo || "");
      pintar(Object.assign({}, r, { confirmado: true }));
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      si.disabled = false;
      si.textContent = "No se pudo. Toca otra vez";
    }
  });
}

(async () => {
  if (!FOLIO) return error("Falta tu folio",
    "Este enlace no trae folio. Pídele a Alberto que te mande el tuyo por WhatsApp.");
  let d;
  try { d = await rpc("ver_cita", { p: { folio: FOLIO } }); }
  catch (e) { return error("No se pudo abrir tu cita",
    "Falló la conexión. Revisa tu internet y vuelve a abrir el enlace."); }

  if (!d.ok) {
    const m = {
      FOLIO_INVALIDO: "Ese folio no se ve bien. Revisa el enlace que te mandaron.",
      NO_EXISTE: "No encontramos ese folio. Puede que el enlace esté mal escrito.",
      DADO_DE_BAJA: "Tu folio ya no está activo. Escríbele a Alberto por WhatsApp."
    };
    return error("Algo no cuadra", m[d.motivo] || "No se pudo abrir tu cita.");
  }
  pintar(Object.assign({}, d, { confirmado: d.ya_estaba }));
})();
</script>
</body>
</html>
